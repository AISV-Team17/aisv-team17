receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    limit_mib: 200
    spike_limit_mib: 50
    check_interval: 5s
  batch:
    timeout: 5s
    send_batch_size: 512

exporters:
  otlphttp/ingest:
    traces_endpoint: http://ingest:8001/internal/v1/traces
    tls:
      insecure: true
  prometheus:
    endpoint: 0.0.0.0:8889

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/ingest]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]