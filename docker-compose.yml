services:

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: aisv
      POSTGRES_USER: aisv
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    mem_limit: 2048m
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aisv -d aisv"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./infra/otel-collector/config.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4318:4318"
    mem_limit: 256m
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.0
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    mem_limit: 512m
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s:%(http_port)s/grafana"
    volumes:
      - ./infra/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    mem_limit: 256m
    depends_on:
      - prometheus
    restart: unless-stopped

  rag:
    build: ./backend
    command: uvicorn src.rag.main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql+psycopg2://aisv:${POSTGRES_PASSWORD}@postgres:5432/aisv
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: rag
    volumes:
      - ./configs:/app/configs:ro
    ports:
      - "8000:8000"
    mem_limit: 512m
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  ingest:
    build: ./backend
    command: uvicorn src.ingest.main:app --host 0.0.0.0 --port 8001
    environment:
      DATABASE_URL: postgresql+psycopg2://aisv:${POSTGRES_PASSWORD}@postgres:5432/aisv
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      OTEL_SERVICE_NAME: ingest
    mem_limit: 256m
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: ./backend
    command: python -m src.worker.main
    environment:
      DATABASE_URL: postgresql+psycopg2://aisv:${POSTGRES_PASSWORD}@postgres:5432/aisv
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OTEL_SERVICE_NAME: worker
    volumes:
      - models:/app/models
    mem_limit: 1536m
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  drift:
    build: ./backend
    command: python -m src.drift.main
    environment:
      DATABASE_URL: postgresql+psycopg2://aisv:${POSTGRES_PASSWORD}@postgres:5432/aisv
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL}
      OTEL_SERVICE_NAME: drift
    mem_limit: 256m
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  agent:
    build: ./backend
    command: python -m src.agent.main
    environment:
      AGENT_DB_DSN: postgresql+psycopg2://aisv_ro:${POSTGRES_PASSWORD}@postgres:5432/aisv
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OTEL_SERVICE_NAME: agent
    mem_limit: 512m
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  console:
    build: ./backend
    command: uvicorn src.console.main:app --host 0.0.0.0 --port 8002
    environment:
      DATABASE_URL: postgresql+psycopg2://aisv:${POSTGRES_PASSWORD}@postgres:5432/aisv
      CONSOLE_SECRET_KEY: ${CONSOLE_SECRET_KEY}
      CONSOLE_ADMIN_PASSWORD: ${CONSOLE_ADMIN_PASSWORD}
      OTEL_SERVICE_NAME: console
    mem_limit: 256m
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      CONSOLE_API_URL: http://console:8002
    ports:
      - "3000:3000"
    mem_limit: 256m
    depends_on:
      - console
    restart: unless-stopped

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
  models: